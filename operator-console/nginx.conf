# Server block for the operator console, mounted at
# /etc/nginx/conf.d/default.conf in the image. Listens on 8080 (Cloud Run's
# default $PORT; the unprivileged nginx image also defaults to 8080).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Navigation in this app is in-JS state, not URL routing, so there are no
    # deep links to resolve — but the SPA-style fallback keeps any unknown
    # path serving the single entry point rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the HTML entry point so a new deploy is picked up
    # immediately; the (unfingerprinted) CSS/JS get a short cache window.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Baseline hardening for a static stakeholder console. No CSP: the design
    # leans heavily on inline styles and loads Google Fonts, so a strict policy
    # would need 'unsafe-inline' anyway — not worth the false sense of safety.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container logs go to stdout/stderr → Cloud Logging.
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
