name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT_ID: agent-tasker-lcd
  GCP_REGION: us-central1
  COORDINATOR_REPO: us-central1-docker.pkg.dev/agent-tasker-lcd/agent-tasker-dev-coordinator/coordinator
  GCP_GEMINI_REPO: us-central1-docker.pkg.dev/agent-tasker-lcd/agent-tasker-dev-gcp-gemini/gcp-gemini
  GCP_ORCHESTRATOR_REPO: us-central1-docker.pkg.dev/agent-tasker-lcd/agent-tasker-dev-gcp-orchestrator/gcp-orchestrator
  AWS_REGION: us-east-1
  AWS_LAMBDA_ARTIFACTS_BUCKET: agent-tasker-dev-aws-nova-artifacts
  AZURE_GPT_ACR_LOGIN_SERVER: agentaskerdevazgptacr.azurecr.io
  AZURE_GPT_ACR_NAME: agentaskerdevazgptacr
  AZURE_GPT_REPO: agentaskerdevazgptacr.azurecr.io/azure-gpt

jobs:
  node:
    name: Node (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format

      - run: pnpm typecheck

      - run: pnpm test

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive infra

      - name: terraform validate (each module)
        run: |
          set -euo pipefail
          failed=0
          modules=$(find infra -maxdepth 2 -name '*.tf' -type f \
            -not -path '*/node_modules/*' -not -path '*/.terraform/*' \
            -exec dirname {} \; | sort -u)
          for dir in $modules; do
            echo "::group::validate $dir"
            (
              cd "$dir"
              terraform init -backend=false -input=false -no-color
              terraform validate -no-color
            ) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  deploy:
    name: Build, push, and deploy
    needs: [node, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "true"
      # The secrets context is not available in step-level `if`, so presence
      # checks for the Phase 2/3 deploy identities go through env instead.
      HAS_AWS: ${{ secrets.AWS_ROLE_ARN != '' }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      # Node/pnpm are only needed to build the off-cloud agent Lambda/container
      # bundles (AWS/Nova zip, Azure/GPT image). The GCP images build via Docker
      # and don't need them. Gated so GCP-only deploys stay lean.
      - uses: pnpm/action-setup@v4
        if: env.HAS_AWS == 'true' || env.HAS_AZURE == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_AWS == 'true' || env.HAS_AZURE == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Build all images before any Terraform apply so a tag is never
      # written to Cloud Run before it has been pushed to the registry.
      - name: Build and push coordinator
        run: |
          docker build -f coordinator/Dockerfile \
            -t ${{ env.COORDINATOR_REPO }}:${{ github.sha }} .
          docker push ${{ env.COORDINATOR_REPO }}:${{ github.sha }}

      - name: Build and push gcp-gemini
        run: |
          docker build -f agent/gcp-gemini/Dockerfile \
            -t ${{ env.GCP_GEMINI_REPO }}:${{ github.sha }} .
          docker push ${{ env.GCP_GEMINI_REPO }}:${{ github.sha }}

      - name: Build and push gcp-orchestrator
        run: |
          docker build -f agent/gcp-orchestrator/Dockerfile \
            -t ${{ env.GCP_ORCHESTRATOR_REPO }}:${{ github.sha }} .
          docker push ${{ env.GCP_ORCHESTRATOR_REPO }}:${{ github.sha }}

      # Apply modules in dependency order. The project module is applied
      # first so any API or IAM changes it manages are live before the
      # downstream modules run. Image tags are passed as -var overrides so
      # the committed tfvars never contain a hardcoded SHA.
      - name: Terraform apply — project
        working-directory: infra/project
        run: |
          terraform init -backend-config=backend.hcl -input=false -no-color
          terraform apply -auto-approve -input=false -no-color

      - name: Terraform apply — coordinator
        working-directory: infra/coordinator
        run: |
          terraform init -backend-config=backend.hcl -input=false -no-color
          terraform apply -auto-approve -input=false -no-color \
            -var="coordinator_image=${{ env.COORDINATOR_REPO }}:${{ github.sha }}"

      - name: Terraform apply — gcp-gemini agent
        working-directory: infra/agent-gcp-gemini
        run: |
          terraform init -backend-config=backend.hcl -input=false -no-color
          terraform apply -auto-approve -input=false -no-color \
            -var="agent_image=${{ env.GCP_GEMINI_REPO }}:${{ github.sha }}"

      - name: Terraform apply — gcp-orchestrator agent
        working-directory: infra/agent-gcp-orchestrator
        run: |
          terraform init -backend-config=backend.hcl -input=false -no-color
          terraform apply -auto-approve -input=false -no-color \
            -var="agent_image=${{ env.GCP_ORCHESTRATOR_REPO }}:${{ github.sha }}"

      # ── Phase 2: AWS/Nova ────────────────────────────────────────────────
      # Skipped until AWS_ROLE_ARN is configured (the AWS stack and its CI
      # OIDC role come from applying infra/agent-aws-nova).
      - name: Build Lambda zip
        if: env.HAS_AWS == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter '@agent-tasker/agent-aws-nova...' build
          pnpm --filter @agent-tasker/agent-aws-nova deploy --prod /tmp/aws-nova-deploy
          # -y preserves pnpm's symlinked node_modules. Without it, zip
          # dereferences every .pnpm symlink into a full copy, inflating the
          # unzipped bundle ~9x (822MB) past Lambda's 250MB limit; with it the
          # bundle stays ~59MB. Lambda resolves the relative symlinks fine.
          cd /tmp/aws-nova-deploy && zip -r -y "$GITHUB_WORKSPACE/aws-nova.zip" .

      - name: Configure AWS credentials
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Lambda zip to S3
        if: env.HAS_AWS == 'true'
        run: |
          aws s3 cp aws-nova.zip \
            s3://${{ env.AWS_LAMBDA_ARTIFACTS_BUCKET }}/aws-nova-${{ github.sha }}.zip

      - name: Terraform apply — aws-nova agent
        if: env.HAS_AWS == 'true'
        working-directory: infra/agent-aws-nova
        run: |
          terraform init -backend-config=backend.hcl -input=false -no-color
          terraform apply -auto-approve -input=false -no-color \
            -var="agent_lambda_s3_key=aws-nova-${{ github.sha }}.zip"

      # ── Phase 3: Azure/GPT ───────────────────────────────────────────────
      # Skipped until the Azure deploy identity is configured (comes from
      # applying infra/azure-bootstrap).
      - name: Azure login
        if: env.HAS_AZURE == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push azure-gpt
        if: env.HAS_AZURE == 'true'
        # Build remotely in ACR rather than docker build + az acr login on the
        # runner: `az acr login --name <login-server>` does an ARM lookup that
        # fails on the FQDN, and the remote build needs neither Docker nor a
        # registry login (the OIDC session already holds AcrPush).
        run: |
          az acr build --registry ${{ env.AZURE_GPT_ACR_NAME }} \
            --image azure-gpt:${{ github.sha }} \
            -f agent/azure-gpt/Dockerfile .

      - name: Terraform apply — azure-gpt agent
        if: env.HAS_AZURE == 'true'
        working-directory: infra/agent-azure-gpt
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          # The CI service principal is RG-scoped and can't register
          # subscription resource providers; they are pre-registered out of band.
          ARM_RESOURCE_PROVIDER_REGISTRATIONS: "none"
          # State storage has shared-key auth disabled; use AAD (CI SP holds
          # Storage Blob Data Contributor on the state account from bootstrap).
          ARM_STORAGE_USE_AZUREAD: "true"
          # Supplied so re-applies don't reset the Container App secret to the
          # "replace-me" placeholder. Never committed.
          TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          terraform init -backend-config=backend.hcl -input=false -no-color
          terraform apply -auto-approve -input=false -no-color \
            -var="agent_image=${{ env.AZURE_GPT_REPO }}:${{ github.sha }}"
